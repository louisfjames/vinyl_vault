{% extends "base.html" %}
{% load static %}

{% block content %}
<div class="container my-4">

    <!-- Breadcrumb navigation -->
    <nav aria-label="breadcrumb">
        <ol class="breadcrumb bg-transparent px-0">
            <li class="breadcrumb-item"><a href="{% url 'home' %}">Home</a></li>
            <li class="breadcrumb-item"><a href="#">Browse</a></li>
            <li class="breadcrumb-item active" aria-current="page">{{ album.title }}</li>
        </ol>
    </nav>

    <div class="row">

        <!-- Album cover -->
        <div class="col-md-5">
            <img src="{{ album.cover_image_url }}" alt="{{ album.title }}" class="img-fluid">
        </div>

        <!-- Album information: artist, title, price -->
        <div class="col-md-7">
            <p class="mb-1 h4">{{ album.artist }}</p>
            <h1 class="headings">{{ album.title }}</h1>
            {% if album.sale_price %}
            <p class="mb-3">
                <del class="text-muted">£{{ album.price }}</del>
                <span class="font-weight-bold h4 ml-2">£{{ album.sale_price }}</span>
            </p>
            {% else %}
            <p class="font-weight-bold h4 mb-3">£{{ album.price }}</p>
            {% endif %}
        </div>

    </div>
</div>
{% endblock %}
