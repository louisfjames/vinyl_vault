{% extends "base.html" %}
{% load static %}
{% load crispy_forms_tags %}

{% block content %}
<div class="container page-container">

    <div class="row justify-content-center">

        <div class="col-12 col-lg-8">

            <div class="mb-4 text-center">
                <h2 class="headings">Edit Album</h2>
                <hr class="divider mx-auto" style="width: 200px;">
                <p class="text mb-0">
                    Update the details for <strong>{{ album.title }}</strong> below.
                </p>
            </div>

            <div class="info-card">
                <h4 class="mb-3">Album Details</h4>
                <hr class="divider">
                <form method="POST">
                    {% csrf_token %}
                    {{ form | crispy }}
                    <div class="mt-3 d-flex" style="gap: 0.5rem;">
                        <button type="submit" class="btn custom-btn">
                            <i class="fas fa-save mr-2"></i>Save Changes
                        </button>
                        <a href="{% url 'albums:store_management' %}" class="btn custom-btn">
                            Cancel
                        </a>
                    </div>
                </form>
            </div>

        </div>
    </div>

</div>
{% endblock %}
